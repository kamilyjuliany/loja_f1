<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Carrinho</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .carrinho-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    .item-carrinho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }
    .item-carrinho img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .item-info {
      flex: 1;
      margin-left: 20px;
    }
    .item-preco {
      font-weight: bold;
    }
    .remover {
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .total {
      text-align: right;
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
    }
    .finalizar {
      display: block;
      margin: 30px auto 0;
      background: green;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }
    input[type="number"] {
      width: 50px;
      padding: 4px;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="carrinho-container">
    <h1 style="text-align:center;color:green">Meu Carrinho</h1>
    <div id="itens-carrinho"></div>
    <p class="total" id="total"></p>

    <!-- Botão único e estilizado -->
    <div style="text-align: center; margin-top: 20px;">
  <button onclick="finalizarCompra()" style="
    background-color: green;
    color: white;
    border: none;
    padding: 12px 40px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: background-color 0.3s ease;
  " onmouseover="this.style.backgroundColor='#0b6d0b'" onmouseout="this.style.backgroundColor='green'">
    Finalizar Compra
    </button>
  </div>
</body>


  </div>

  <script>
    function agruparProdutos(lista) {
      const agrupados = [];
      lista.forEach(produto => {
        const chave = `${produto.nome}-${produto.tamanho}-${produto.equipe}-${produto.valor}`;
        const existente = agrupados.find(p => `${p.nome}-${p.tamanho}-${p.equipe}-${p.valor}` === chave);
        if (existente) {
          existente.quantidade += produto.quantidade;
        } else {
          agrupados.push({ ...produto });
        }
      });
      return agrupados;
    }

    let carrinho = agruparProdutos(JSON.parse(localStorage.getItem("carrinho")) || []);

    function renderizarCarrinho() {
      const container = document.getElementById("itens-carrinho");
      const totalDiv = document.getElementById("total");
      container.innerHTML = "";

      if (carrinho.length === 0) {
        container.innerHTML = "<p>Seu carrinho está vazio.</p>";
        totalDiv.textContent = "";
        return;
      }

      let total = 0;

      carrinho.forEach((produto, index) => {
        const subtotal = produto.valor * produto.quantidade;
        total += subtotal;

        const item = document.createElement("div");
        item.className = "item-carrinho";
        item.innerHTML = `
          <img src="img/produtos/${produto.imagem}" alt="${produto.nome}">
          <div class="item-info">
            <h3>${produto.nome}</h3>
            <p>Tamanho: ${produto.tamanho}</p>
            <p>Equipe: ${produto.equipe}</p>
            <label>
              Quantidade:
              <input type="number" min="1" value="${produto.quantidade}" onchange="atualizarQuantidade(${index}, this.value)">
            </label>
            <p class="item-preco">Subtotal: R$ ${subtotal.toFixed(2).replace('.', ',')}</p>
          </div>
          <button class="remover" onclick="removerItem(${index})">Remover</button>
        `;
        container.appendChild(item);
      });

      totalDiv.textContent = "Total: R$ " + total.toFixed(2).replace('.', ',');
    }

    function atualizarQuantidade(index, novaQtd) {
      const qtd = parseInt(novaQtd);
      if (qtd > 0) {
        carrinho[index].quantidade = qtd;
        localStorage.setItem("carrinho", JSON.stringify(carrinho));
        renderizarCarrinho();
      }
    }

    function removerItem(index) {
      carrinho.splice(index, 1);
      localStorage.setItem("carrinho", JSON.stringify(carrinho));
      renderizarCarrinho();
    }

    function finalizarCompra() {
      if (carrinho.length === 0) {
        alert("Seu carrinho está vazio.");
        return;
      }
      localStorage.setItem("carrinho", JSON.stringify(carrinho));
      window.location.href = "php/finalizar.php";
    }

    renderizarCarrinho();
  </script>
</body>
</html>
