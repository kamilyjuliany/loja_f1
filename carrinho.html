<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho de Compras</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .carrinho-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .item-carrinho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }

    .item-carrinho img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .item-info {
      flex: 1;
      margin-left: 20px;
    }

    .item-preco {
      font-weight: bold;
    }

    .remover {
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .total {
      text-align: right;
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
    }

    .finalizar {
      display: block;
      margin: 30px auto 0;
      background: green;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="carrinho-container">
    <h1>Meu Carrinho</h1>
    <div id="itens-carrinho"></div>
    <p class="total" id="total"></p>
    <button class="finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
  </div>

  <script>
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    function renderizarCarrinho() {
      const container = document.getElementById("itens-carrinho");
      const totalDiv = document.getElementById("total");
      container.innerHTML = "";

      if (carrinho.length === 0) {
        container.innerHTML = "<p>Seu carrinho está vazio.</p>";
        totalDiv.textContent = "";
        return;
      }

      let total = 0;

      carrinho.forEach((produto, index) => {
        total += parseFloat(produto.valor);

        const item = document.createElement("div");
        item.className = "item-carrinho";
        item.innerHTML = `
          <img src="img/produtos/${produto.imagem}" alt="${produto.nome}">
          <div class="item-info">
            <h3>${produto.nome}</h3>
            <p>Tamanho: ${produto.tamanho}</p>
            <p>Equipe: ${produto.equipe}</p>
            <p class="item-preco">R$ ${Number(produto.valor).toFixed(2).replace('.', ',')}</p>
          </div>
          <button class="remover" onclick="removerItem(${index})">Remover</button>
        `;
        container.appendChild(item);
      });

      totalDiv.textContent = "Total: R$ " + total.toFixed(2).replace('.', ',');
    }

    function removerItem(index) {
      carrinho.splice(index, 1);
      localStorage.setItem("carrinho", JSON.stringify(carrinho));
      renderizarCarrinho();
    }

    function finalizarCompra() {
      if (carrinho.length === 0) {
        alert("Seu carrinho está vazio.");
        return;
      }

      alert("Compra simulada com sucesso! Obrigado.");
      localStorage.removeItem("carrinho");
      renderizarCarrinho();
    }

    renderizarCarrinho();
  </script>
</body>
</html>
