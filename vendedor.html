<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Vendedor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Painel do Vendedor</h1>
  <form action="php/cadastrar_produto.php" method="POST">
    <label>Nome do Produto:</label><br>
    <input type="text" name="nome" required><br>

    <label>Valor (R$):</label><br>
    <input type="number" name="valor" step="0.01" required><br>

    <label>Tamanho:</label><br>
    <select name="tamanho" required>
      <option>P</option>
      <option>M</option>
      <option>G</option>
      <option>GG</option>
    </select><br>

    <label>Equipe:</label><br>
    <select name="equipe" required>
      <option>Ferrari</option>
      <option>Mercedes</option>
      <option>RedBull</option>
      <option>McLaren</option>
      <option>Stake</option>
      <option>Visa Cash</option>
      <option>Haas</option>
      <option>Williams</option>
    </select><br><br>

    <button type="submit">Cadastrar Produto</button>
  </form>
</body>
</html>
